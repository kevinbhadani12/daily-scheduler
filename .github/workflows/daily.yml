name: Daily briefings

on:
  schedule:
    - cron: "*/15 * * * *"   # checks every 15 minutes; times are set in config.yaml
  workflow_dispatch:
    inputs:
      briefing:
        description: "Briefing id to make right now (e.g. business). Leave empty to run whatever is due."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-briefings
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
      EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}   # latest commit, so finished briefings aren't repeated

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Make briefings
        env:
          BRIEFING: ${{ inputs.briefing }}
        run: |
          if [ -n "$BRIEFING" ]; then
            python main.py generate --only "$BRIEFING" --force
          else
            python main.py generate
          fi

      - name: Publish pages
        if: always()
        run: |
          git config user.name "daily-scheduler-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
          else
            git commit -m "Briefings $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M')"
            git pull --rebase   # in case settings were changed from the dashboard meanwhile
            git push
          fi

      - name: Send notifications
        if: always()
        run: python main.py notify
