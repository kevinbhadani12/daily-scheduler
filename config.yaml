# ─────────────────────────────────────────────────────────────
#  Daily Scheduler – your settings
#  Change times, add briefings, or switch them on/off here.
#  No code changes needed.
# ─────────────────────────────────────────────────────────────

# Your timezone (all times below are in this timezone)
timezone: Asia/Kolkata

# Where the full briefing pages are published (GitHub Pages).
site_url: https://kevinbhadani12.github.io/daily-scheduler

# Your country (2-letter code), so the AI knows which local news matters to you
country: IN

# How many past days of headlines to remember, so stories don't repeat
history_days: 7

# Default AI settings (each briefing can override these)
defaults:
  model: gemini-3.8-flash   # or gemini-4-argon (Google's strongest, ~3x the price)
  effort: high              # minimal | low | medium | high  (how hard Gemini thinks)

briefings:
  - id: business                     # short name, used in links (no spaces)
    name: Daily Business Briefing
    prompt_file: briefings/business.md
    time: "07:00"                    # 24-hour format, e.g. "07:00", "18:30"
    days: daily                      # daily | weekdays | [mon, wed, fri]
    deliver: [telegram, email]       # where to send the link
    enabled: true

  - id: stock-market
    name: Stock Market Update
    prompt_file: briefings/stock-market.md
    time: "16:30"                    # after Indian market closes (3:30 PM)
    days: weekdays
    deliver: [telegram, email]
    enabled: false                   # set to true to start receiving it
    effort: medium
